<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ainger Tomlin - Chartered Accountants</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header Navigation -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <div class="logo-image">
                    <img src="images/logo.png" alt="Ainger Tomlin Chartered Accountants">
                </div>
            </div>
            
            <!-- Navigation Menu -->
            <nav class="nav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="#home" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="#services" class="nav-link">Services</a></li>
                    <li class="nav-item"><a href="#about" class="nav-link">About</a></li>
                    <li class="nav-item"><a href="#resources" class="nav-link">Resources</a></li>
                    <li class="nav-item"><a href="#contact" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <!-- Background Image Container - Replace with your hero image -->
        <div class="hero-background">
            <!-- INSERT YOUR HERO BACKGROUND IMAGE HERE -->
            <img src="images/background-image.jpg" alt="Background">
        </div>
        
        <!-- Hero Content -->
        <div class="hero-content">
            <p class="hero-subtitle">Trusted local accounting services</p>
            <h1 class="hero-title">We let you focus on what matters.</h1>
            <a href="#services" class="hero-cta">
                Our Accounting Services
                <span class="arrow">→</span>
            </a>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
